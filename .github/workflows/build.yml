# PR마다 형식·린트·테스트·빌드를 검사한다. 비밀값을 쓰지 않는다
name: build

on:
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: build
        run: cargo build --release
      # 2번 서버(RAM 1GB)에서 cargo build를 하지 않고 측정하려고 러너에서 측정 프로그램을 빌드해 올린다
      - name: build image_bench
        run: cargo build --release --example image_bench
      - uses: actions/upload-artifact@v4
        with:
          name: image_bench
          path: target/release/examples/image_bench
          retention-days: 14
