[package]
name = "nyangmeong-character"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
multer = "3.1.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# 이미지 계산 테스트(tests/image_gold.rs)가 최적화 없이는 2분 넘게 걸린다. 오버플로 검사는 그대로 둔다
[profile.dev]
opt-level = 2
